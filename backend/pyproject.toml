[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AI_Apostle", email = "achasaviourikhamate@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "supabase>=2.31.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
backend = "backend:main"

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pyright]
extraPaths = ["."]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]

